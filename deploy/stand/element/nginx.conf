# Element Web по HTTPS: браузеру нужен secure context, иначе
# crypto.randomUUID недоступен и Element зависает на старте.
server {
    listen 80;
    server_name _;
    return 301 https://$host:18080$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    root /app;
    index index.html;

    ssl_certificate     /etc/nginx/tls/element.crt;
    ssl_certificate_key /etc/nginx/tls/element.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /_matrix/ {
        proxy_pass https://syngod-a:8448;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    location /config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location /bundles/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
