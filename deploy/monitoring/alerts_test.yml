# Тесты правил алертов:
#   docker run --rm -v "$PWD/deploy/monitoring:/m:ro" --entrypoint promtool \
#     prom/prometheus:v3.1.0 test rules /m/alerts_test.yml
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - name: недоступность и готовность
    interval: 1m
    input_series:
      - series: 'up{job="syngod-prod",instance="a:9108"}'
        values: "1 1 0 0 0 0"
      - series: 'syngo_ready{job="syngod-prod",instance="a:9108"}'
        values: "1 0 0 0 0 0"
      - series: 'syngo_instance_lock_held{job="syngod-prod",instance="a:9108"}'
        values: "1 1 1 1 1 1"
    alert_rule_test:
      - eval_time: 5m
        alertname: SyngoDown
        exp_alerts:
          - exp_labels: {severity: critical, job: syngod-prod, instance: "a:9108"}
            exp_annotations:
              summary: "syngod a:9108 не отвечает на /metrics 2 минуты"
              runbook: "docs/operations.md#syngodown"
      - eval_time: 4m
        alertname: SyngoNotReady
        exp_alerts:
          - exp_labels: {severity: critical, job: syngod-prod, instance: "a:9108"}
            exp_annotations:
              summary: "syngod a:9108 не готов (/health/ready 503) 2 минуты"
              description: "Проверка: syngo_ready_check == 0 показывает причину (database, schema, instance_lock, draining)."
              runbook: "docs/operations.md#syngonotready"
      - eval_time: 5m
        alertname: SyngoInstanceLockLost
        exp_alerts: []

  - name: 5xx выше 5%
    interval: 1m
    input_series:
      # 10 запросов в секунду, из них 1 - 500.
      - series: 'syngo_http_requests_total{instance="a",method="GET",route="/r",code="200"}'
        values: "0+540x15"
      - series: 'syngo_http_requests_total{instance="a",method="GET",route="/r",code="500"}'
        values: "0+60x15"
    alert_rule_test:
      - eval_time: 12m
        alertname: SyngoHigh5xxRate
        exp_alerts:
          - exp_labels: {severity: critical, instance: a}
            exp_annotations:
              summary: "syngod a: больше 5% ответов 5xx за 5 минут"
              runbook: "docs/operations.md#syngohigh5xxrate"

  - name: 5xx ниже порога
    interval: 1m
    input_series:
      - series: 'syngo_http_requests_total{instance="a",method="GET",route="/r",code="200"}'
        values: "0+600x15"
      - series: 'syngo_http_requests_total{instance="a",method="GET",route="/r",code="503"}'
        values: "0+6x15"
    alert_rule_test:
      - eval_time: 12m
        alertname: SyngoHigh5xxRate
        exp_alerts: []

  - name: p99 обработки /sync
    interval: 1m
    input_series:
      # Все запросы попадают в корзину 2.5 с: p99 около 2.5 с.
      - series: 'syngo_sync_duration_seconds_bucket{instance="a",le="1"}'
        values: "0x20"
      - series: 'syngo_sync_duration_seconds_bucket{instance="a",le="2.5"}'
        values: "0+60x20"
      - series: 'syngo_sync_duration_seconds_bucket{instance="a",le="+Inf"}'
        values: "0+60x20"
    alert_rule_test:
      - eval_time: 18m
        alertname: SyngoSyncSlowP99
        exp_alerts:
          - exp_labels: {severity: warning, instance: a}
            exp_annotations:
              summary: "syngod a: p99 обработки /sync выше 1 с (10 минут)"
              runbook: "docs/operations.md#syngosyncslowp99"

  - name: место на томе медиа
    interval: 1m
    input_series:
      - series: 'syngo_media_disk_free_bytes{instance="a"}'
        values: "50x20"
      - series: 'syngo_media_disk_size_bytes{instance="a"}'
        values: "1000x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: SyngoMediaDiskLow
        exp_alerts:
          - exp_labels: {severity: warning, instance: a}
            exp_annotations:
              summary: "Том медиа a: свободно меньше 10%"
              runbook: "docs/operations.md#syngomediadisklow"
      - eval_time: 15m
        alertname: SyngoMediaDiskCritical
        exp_alerts: []

  - name: бэкап не выполнялся
    interval: 5m
    input_series:
      # Последний успешный бэкап - в момент 0, затем метрика не меняется (30 ч).
      - series: 'syngo_backup_last_success_timestamp_seconds{instance="backup-host"}'
        values: "0x360"
      - series: 'syngo_backup_last_failure_timestamp_seconds{instance="backup-host"}'
        values: "0x360"
    alert_rule_test:
      - eval_time: 25h
        alertname: SyngoBackupMissing
        exp_alerts: []
      - eval_time: 28h
        alertname: SyngoBackupMissing
        exp_alerts:
          - exp_labels: {severity: critical, instance: backup-host}
            exp_annotations:
              summary: "Бэкап SYNGO не выполнялся больше 26 часов (backup-host)"
              runbook: "docs/operations.md#syngobackupmissing"

  - name: бэкап упал
    interval: 1m
    input_series:
      - series: 'syngo_backup_last_success_timestamp_seconds{instance="backup-host"}'
        values: "1000x10"
      - series: 'syngo_backup_last_failure_timestamp_seconds{instance="backup-host"}'
        values: "0 0 0 0 0 5000 5000 5000 5000 5000 5000"
    alert_rule_test:
      - eval_time: 3m
        alertname: SyngoBackupFailed
        exp_alerts: []
      - eval_time: 7m
        alertname: SyngoBackupFailed
        exp_alerts:
          - exp_labels: {severity: critical, instance: backup-host}
            exp_annotations:
              summary: "Последний запуск бэкапа SYNGO завершился ошибкой (backup-host)"
              runbook: "docs/operations.md#syngobackupmissing"

  - name: очередь push
    interval: 1m
    input_series:
      - series: 'syngo_push_queued_notifications{instance="a"}'
        values: "0 100 600 700 800 900 900 900 900 900 900 900 900 900 900"
      - series: 'syngo_push_active_queues{instance="a"}'
        values: "1x15"
      - series: 'syngo_push_max_active_queues{instance="a"}'
        values: "1024x15"
    alert_rule_test:
      - eval_time: 5m
        alertname: SyngoPushQueueBacklog
        exp_alerts: []
      - eval_time: 14m
        alertname: SyngoPushQueueBacklog
        exp_alerts:
          - exp_labels: {severity: warning, instance: a}
            exp_annotations:
              summary: "Push a: очередь доставки растет 10 минут (шлюз медленный или недоступен)"
              runbook: "docs/operations.md#syngopushqueuebacklog"
