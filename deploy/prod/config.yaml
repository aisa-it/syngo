# Конфиг продового compose. Секреты, DSN и server_name - только из
# окружения (.env рядом с docker-compose.yml), здесь их нет. Полный список
# параметров - config.example.yaml в корне репозитория.
env: prod

server:
  addr: ":8008"
  read_header_timeout: 10s
  read_timeout: 30s
  write_timeout: 60s
  idle_timeout: 120s
  shutdown_timeout: 15s
  # Служебный листенер: /metrics и подробные пробы. Порт
  # публикуется только на loopback хоста (docker-compose.yml).
  ops_addr: ":9108"
  # Доверенные прокси - SYNGOD_TRUSTED_PROXIES в .env: адрес TLS-прокси,
  # каким его видит syngod (см. docker-compose.yml). Пример: ["172.18.0.1"].
  trusted_proxies: []

database:
  # DSN - SYNGOD_DATABASE_DSN из .env. Пул: 2-3 соединения на ядро
  # сервера PostgreSQL; у postgres из docker-compose.yml max_connections по умолчанию (100) -
  # запас под бэкап, миграции и psql. См. docs/operations.md, 6.1.
  max_conns: 20

auth:
  # Регистрация закрыта: пользователей создает оператор через
  # /_synapse/admin/v1/register (SYNGOD_REGISTRATION_SHARED_SECRET).
  registration_open: false
  min_password_length: 8

media:
  storage_backend: local
  directory: /var/syngo/media
  max_upload_bytes: 52428800

log:
  level: info
  format: json

federation:
  enabled: false
