# golangci-lint v2 (проверено на v2.15.0: `golangci-lint config verify`)
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # поиск багов
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - nilerr
    - errorlint
    - contextcheck
    - noctx
    - copyloopvar
    - wastedassign
    - unconvert
    - gosec
    # стиль и поддерживаемость
    - gocritic
    - revive
    - misspell
    - nakedret
    - whitespace
    - unparam
    - prealloc

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    gocritic:
      enabled-tags: [diagnostic, performance, style]
      disabled-checks:
        - whyNoLint
        - hugeParam
        - appendAssign
    gosec:
      excludes:
        - G404
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers, disableStutteringCheck]
        - name: package-comments
        - name: context-as-argument
        - name: error-strings
        - name: error-return
        - name: indent-error-flow
        - name: var-naming
    errcheck:
      check-type-assertions: true
      check-blank: false
    staticcheck:
      checks: ["all"]

  exclusions:
    presets: [comments, std-error-handling, common-false-positives, legacy]
    rules:
      - path: _test\.go
        linters: [errcheck, gosec, noctx, bodyclose, unparam, dupl]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
    goimports:
      local-prefixes:
        - github.com/aisa-it/syngo

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
